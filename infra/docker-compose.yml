services:
  postgres:
    image: postgres:17-alpine
    container_name: parallel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parallel
      POSTGRES_USER: parallel
      POSTGRES_PASSWORD: parallel_dev
    ports:
      - "5432:5432"
    volumes:
      - parallel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallel -d parallel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parallel-postgres-data:
